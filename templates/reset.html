<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | FoodieFinds</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
</head>
<body>

  <!--VI <-> EN-->
  <div class="lang-toggle" id="langToggle" style="display: none;">
    <span class="label left">VI</span>
    <div class="track" id="langTrack"><div class="slider"></div></div>
    <span class="label right">EN</span>
  </div>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" />
      <h2>FoodieFinds</h2>
    </div>
    <nav class="nav-links">
      <a href="{{ url_for('home') }}" id="nav-home" data-key="Home">Home</a>
      <a href="{{ url_for('home') }}#about" data-key="About">About</a>
      <a href="{{ url_for('search') }}" id="nav-search" data-key="Search">Search</a>
      <a href="{{ url_for('community') }}" data-key="Community">Community</a>
    </nav>
  </header>

  <!-- RESET FORM -->
  <div class="login-page">
    <div class="login-container">
      <h1>Reset Password</h1>
      <form method="POST" action="{{ url_for('auth.reset_password') }}">
        <input type="text" name="otp" placeholder="Enter OTP" required />
        <input type="password" name="new_password" placeholder="New password" required />
        <input type="password" name="confirm_password" placeholder="Confirm password" required />
        <button type="submit">Change Password</button>

        {% if error %}
          <p class="error" style="color: red;">{{ error }}</p>
        {% elif message %}
          <p class="success" style="color: green;">{{ message }}</p>
        {% endif %}
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 FoodieFinds. All rights reserved.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/lang.js') }}"></script>
</body>
</html>
