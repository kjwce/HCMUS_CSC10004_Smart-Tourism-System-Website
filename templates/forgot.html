<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password | FoodieFinds</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/logo.png') }}">
</head>
<body>
    
  <!--VI <-> EN-->
  <div class="lang-toggle" id="langToggle" style="display: none;">
    <span class="label left">VI</span>
    <div class="track" id="langTrack"><div class="slider"></div></div>
    <span class="label right">EN</span>
  </div>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" />
      <h2>FoodieFinds</h2>
    </div>
    <nav class="nav-links">
      <a href="{{ url_for('home') }}" id="nav-home" data-key="Home">Home</a>
      <a href="{{ url_for('home') }}#about" data-key="About">About</a>
      <a href="{{ url_for('search') }}" id="nav-search" data-key="Search">Search</a>
      <a href="{{ url_for('community') }}" data-key="Community">Community</a>
    </nav>
  </header>

  <!-- FORGOT PASSWORD -->
  <div class="login-page">
    <div class="login-container">
      <h1 data-key="Forgot password title">Forgot password</h1>

      {% if message %}
        <p style="color: green; font-size: 0.95rem;">{{ message }}</p>
      {% elif error %}
        <p style="color: red; font-size: 0.95rem;">{{ error }}</p>
      {% else %}
        <p style="font-size: 0.95rem; color: #555; margin-bottom: 15px;" data-key="Forgot password instruction">
          Enter your email address to receive a password reset code.
        </p>
      {% endif %}

      <form method="POST" action="{{ url_for('auth.forgot') }}">
        <input type="email" name="email" placeholder="Email" required/>
        <button type="submit" data-key="Submit button">Submit</button>
        <p class="extra-links">
          <a href="{{ url_for('form_login') }}" data-key="Back to log in link">Back to log in</a>
        </p>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <p>© 2025 FoodieFinds. All rights reserved.</p>
  </footer>

  <script src="{{ url_for('static', filename='js/lang.js') }}"></script>
</body>
</html>
